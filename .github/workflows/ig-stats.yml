name: IG Stats
on:
  schedule:
    - cron: "0 21 * * *"   # 22h00 Lisboa (21h UTC)
  workflow_dispatch: {}      # botão de teste manual
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch insights
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python fetch_insights.py
      - name: Commit
        run: |
          git config user.name "ig-stats-bot"
          git config user.email "bot@financascomdados"
          git add performance.json
          git diff --cached --quiet || git commit -m "stats: sync diario"
          git push
