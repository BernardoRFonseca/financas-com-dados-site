name: tiktok setup (correr uma vez)

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Código de autorização (tudo o que está entre code= e o primeiro &)'
        required: true

permissions:
  actions: write

jobs:
  trocar-codigo-por-tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar código por tokens e guardar
        env:
          CODE: ${{ github.event.inputs.auth_code }}
          CK: ${{ secrets.TIKTOK_CLIENT_KEY }}
          CS: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RESP=$(curl -s -X POST 'https://open.tiktokapis.com/v2/oauth/token/' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_key=$CK" \
            --data-urlencode "client_secret=$CS" \
            --data-urlencode "code=$CODE" \
            --data-urlencode 'grant_type=authorization_code' \
            --data-urlencode 'redirect_uri=https://financas-com-dados-site.vercel.app/')
          RT=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("refresh_token",""))')
          OID=$(echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("open_id",""))')
          if [ -z "$RT" ]; then
            echo "❌ A troca falhou. Resposta (sem tokens):"
            echo "$RESP" | python3 -c 'import sys,json;d=json.load(sys.stdin);print({k:v for k,v in d.items() if "token" not in k})'
            exit 1
          fi
          echo "::add-mask::$RT"
          gh variable set TIKTOK_REFRESH_TOKEN --body "$RT" -R "$GITHUB_REPOSITORY"
          gh variable set TIKTOK_OPEN_ID --body "$OID" -R "$GITHUB_REPOSITORY"
          echo "✅ Tokens trocados e guardados como variáveis do repositório. Fase 2 completa."
